# Comportamento do robot

publicacao:
  # revisao    -> cada notícia abre um Pull Request no GitHub; aprovas com "Merge"
  # automatico -> publica logo no site
  # misto      -> categorias em "automatico_categorias" publicam logo, o resto vai para revisão
  modo: revisao
  automatico_categorias: [desporto, cultura, tecnologia]

filtro:
  importancia_minima: 6        # 1 a 10 — só escreve notícias com nota >= a esta
  max_artigos_por_execucao: 8  # limite de custo por execução (a cada ~15 min)
  max_itens_por_fonte: 15      # só olha para os N itens mais recentes de cada feed
  idade_maxima_horas: 12       # ignora itens mais antigos do que isto

claude:
  # Seleção e triagem: claude-haiku-4-5 (barato). Pesquisa e redação: claude-sonnet-5.
  # Nos testes, o Haiku errou números na redação: não o usar para escrever sem revisão humana.
  # O "esforco" só se aplica aos modelos Sonnet/Opus.
  modelo_triagem: claude-haiku-4-5
  modelo_redacao: claude-sonnet-5
  esforco_triagem: low
  esforco_redacao: medium
